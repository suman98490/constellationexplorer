---
openapi: "3.0.1"
info:
  title: "application"
  version: "a"
servers:
- url: "{server}/prweb/api/application/v2"
  description: "Default Application"
  variables:
    server:
      default: "https://6ukkcalr.pegace.net"
- url: "{server}/prweb/app/{alias}/api/application/v2"
  description: "Specific Application"
  variables:
    server:
      default: "https://6ukkcalr.pegace.net"
    alias:
      default: "PegaRULES"
      enum:
      - "clm--client-onboarding-for-financial-services"
      - "PegaRULES"
security:
- Password: []
- ClientCredentials: []
- AuthCode: []
tags:
- name: "Agent2Agent (A2A)"
- name: "AgentX"
- name: "Assignment"
- name: "GenAI Assistant"
- name: "Attachment"
- name: "Authentication Profile"
- name: "Case"
- name: "Document"
- name: "Follower"
- name: "Participants"
- name: "Related case"
- name: "Tag"
- name: "Case type"
- name: "Page"
- name: "Static Content"
- name: "Data"
- name: "Social"
- name: "Recents"
- name: "B2S Authentication Token"
- name: "List"
- name: "Personalizations"
- name: "User Settings"
paths:
  /ai-agents:
    get:
      tags:
      - "Agent2Agent (A2A)"
      summary: "Fetch all agents"
      description: "<p>Fetch all agents enabled for external access</p>"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.PEGA-API-AI-AGENT-CARD.true.PEGA_API.PZTRANSLATEVIEWPAGETOJSONARRAY"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /ai-agents/{agentID}/conversations:
    get:
      tags:
      - "AgentX"
      summary: "Get conversations"
      description: "<p>This automation is used to fetch the conversations</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      - name: "contextID"
        in: "query"
        description: "Context ID"
        required: true
        schema:
          type: "string"
      - name: "pageSize"
        in: "query"
        description: "list of results that should be there inside a page"
        allowEmptyValue: true
        schema:
          type: "string"
      - name: "pageIndex"
        in: "query"
        description: "Index of page that need to be retrived"
        allowEmptyValue: true
        schema:
          type: "string"
      responses:
        "200":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  conversations:
                    title: "conversations"
                    type: "array"
                    items:
                      $ref: "#/components/schemas/RULE-OBJ-CLASS.PEGA-AUTOPILOT-CONVERSATION.true.PEGA_API"
                additionalProperties: false
        "500":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "400":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
    post:
      tags:
      - "AgentX"
      summary: "Initiate AI conversation"
      description: "<p>Publishes the&nbsp;YAML, initiates a conversation for the given\
        \ agent rule in the given context and returns conversation ID along with other\
        \ fields. interactionID is part of request payload when&nbsp;a conversation\
        \ is initiated from non pega application.</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                contextID:
                  title: "contextID"
                  type: "string"
                  description: "Context ID"
                interactionID:
                  title: "interactionID"
                  type: "string"
                  description: "Interaction ID"
                activeChannel:
                  title: "activeChannel"
                  type: "string"
                  description: "Channel on which agent is invoked"
                activeChannelID:
                  title: "activeChannelID"
                  type: "string"
                  description: "ID of Channel on which agent is invoked"
                executeStarterQuestion:
                  title: "executeStarterQuestion"
                  type: "boolean"
                  description: "executeStarterQuestion"
              additionalProperties: false
      responses:
        "201":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ID:
                    title: "ID"
                    type: "string"
                    description: "Conversation ID"
                  response:
                    title: "response"
                    type: "string"
                    description: "response"
                  suggestedPrompts:
                    title: "suggestedPrompts"
                    type: "array"
                    description: "suggestedPrompts"
                    items:
                      $ref: "#/components/schemas/RULE-OBJ-CLASS.EMBED-GENAI-ASSISTANT-CONVERSATIONSTARTERS.true.PEGA_API"
                  initialInstruction:
                    title: "initialInstruction"
                    type: "string"
                    description: "Initial instruction for which autopilot responds\
                      \ on load of agent"
                  initialAdditionalInstruction:
                    title: "initialAdditionalInstruction"
                    type: "string"
                    description: "Additional instruction for System initiated instruction"
                  messageID:
                    title: "messageID"
                    type: "string"
                    description: "messageID"
                  enableTracer:
                    title: "enableTracer"
                    type: "boolean"
                    description: "enableTracer"
                  aiGuidedQuestions:
                    title: "aiGuidedQuestions"
                    type: "array"
                    description: "aiGuidedQuestions"
                    items:
                      $ref: "#/components/schemas/RULE-OBJ-CLASS.EMBED-GENAI-ASSISTANT-CONVERSATIONSTARTERS.true.PEGA_API"
                  supportedCapabilities:
                    title: "supportedCapabilities"
                    description: "supportedCapabilities"
                    allOf:
                    - $ref: "#/components/schemas/RULE-OBJ-CLASS.PEGA-API-AI-AGENT-CAPABILITIES.true.PEGA_API.PZMAPAGENTCAPABILITIES"
                additionalProperties: false
        "400":
          description: "Invalid Inputs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Resource not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: "Internal Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /ai-agents/{agentID}/conversations/{conversationID}/close:
    put:
      tags:
      - "AgentX"
      summary: "End a conversation"
      description: "<p>Used to end the conversation of an agent</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent ID"
        required: true
        schema:
          type: "string"
      - name: "conversationID"
        in: "path"
        description: "Conversation ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Resource not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "409":
          description: "Resource in the wrong state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "423":
          description: "Resource is locked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /ai-agents/{agentID}/conversations/{conversationID}/messages/{messageID}/like:
    put:
      tags:
      - "AgentX"
      summary: "Like a message"
      description: "<p>Like&nbsp;a message in a conversation</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      - name: "conversationID"
        in: "path"
        description: "Conversation ID"
        required: true
        schema:
          type: "string"
      - name: "messageID"
        in: "path"
        description: "Message ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
        "400":
          description: "Invalid Inputs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Resource not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: "Execution error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /ai-agents/{agentID}/conversations/{conversationID}:
    get:
      tags:
      - "AgentX"
      summary: "Get a conversation"
      description: "<p>This automation is used to fetch the conversation details</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      - name: "conversationID"
        in: "path"
        description: "Conversation ID"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Conversation object which holds messages"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.PEGA-AUTOPILOT-CONVERSATION.true.PEGA_API.PZCONVERTCONVERSATIONPAGETOJSON"
        "500":
          description: "Internal error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
    patch:
      tags:
      - "AgentX"
      summary: "Send a message in a conversation"
      description: "<p>Sends message in a conversation&nbsp;to Autopilot Service and\
        \ returns the response.</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      - name: "conversationID"
        in: "path"
        description: "Conversation ID"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                Request:
                  title: "Request"
                  type: "string"
                  description: "Request"
                Attachments:
                  title: "Attachments"
                  type: "array"
                  description: "Attachments"
                  items:
                    $ref: "#/components/schemas/RULE-OBJ-CLASS.EMBED-DRAGDROPFILE.true.PEGA_API"
                activeChannel:
                  title: "activeChannel"
                  type: "string"
                  description: "Channel on which agent is invoked"
                activeChannelID:
                  title: "activeChannelID"
                  type: "string"
                  description: "Channel ID on which agent is invoked"
                capabilities:
                  title: "capabilities"
                  description: "capabilities"
                  allOf:
                  - $ref: "#/components/schemas/RULE-OBJ-CLASS.PEGA-API-AI-AGENT-CAPABILITIES.true.PEGA_API.PZMAPAGENTCAPABILITIES"
              additionalProperties: false
      responses:
        "200":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  response:
                    title: "response"
                    type: "string"
                    description: "Response"
                  messageID:
                    title: "messageID"
                    type: "string"
                    description: "Message ID"
                  aiGuidedQuestions:
                    title: "aiGuidedQuestions"
                    type: "array"
                    description: "AI Guided Questions"
                    items:
                      $ref: "#/components/schemas/RULE-OBJ-CLASS.EMBED-GENAI-ASSISTANT-CONVERSATIONSTARTERS.true.PEGA_API"
                additionalProperties: false
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Resource not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "409":
          description: "Resource in the wrong state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "423":
          description: "Resource is locked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: "Internal Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /ai-agents/{agentID}/conversations/{conversationID}/messages/{messageID}/dislike:
    put:
      tags:
      - "AgentX"
      summary: "Dislike a message"
      description: "<p>Dislike&nbsp;a message in a conversation</p>"
      parameters:
      - name: "agentID"
        in: "path"
        description: "Agent Rule ID"
        required: true
        schema:
          type: "string"
      - name: "conversationID"
        in: "path"
        description: "Conversation ID"
        required: true
        schema:
          type: "string"
      - name: "messageID"
        in: "path"
        description: "Message ID"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                feedbackText:
                  title: "feedbackText"
                  type: "string"
                  description: "Response"
              additionalProperties: false
      responses:
        "200":
          description: ""
          headers:
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
        "400":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Resource not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "500":
          description: "Execution error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /assignments/next:
    get:
      tags:
      - "Assignment"
      summary: "Get next assignment details"
      description: "<p>Get next available assignment for the requestor. &quot;uiResources&quot;\
        \ node in response&nbsp;is not applicable for viewType &quot;none&quot;</p>"
      parameters:
      - name: "x-origin-channel"
        in: "header"
        description: "Origin of this service. E.g. - Web, Mobile etc."
        schema:
          type: "string"
      - name: "viewType"
        in: "query"
        description: "form - returns the form UI metadata, page - returns the full\
          \ page UI metadata"
        allowEmptyValue: true
        schema:
          type: "string"
          default: "page"
          enum:
          - "page"
          - "form"
      - name: "pageName"
        in: "query"
        description: "returns UI metadata for given pageName"
        allowEmptyValue: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Response"
          headers:
            etag:
              description: "etag holds unique value"
              schema:
                type: "string"
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SCHEMA_FILE_WEBWB_PZGETASSIGNMENT"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "423":
          description: "Locked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /assignments/{assignmentID}:
    get:
      tags:
      - "Assignment"
      summary: "Get assignment details"
      description: "<p>&nbsp;</p>\n\n<p>Retrieves&nbsp;assignment metadata based on\
        \ assignment ID passed.&nbsp;&quot;uiResources&quot; node in response&nbsp;is\
        \ not applicable for viewType &quot;none&quot;</p>"
      parameters:
      - name: "x-origin-channel"
        in: "header"
        description: "Origin of this service. E.g. - Web, Mobile etc."
        schema:
          type: "string"
      - name: "assignmentID"
        in: "path"
        description: "Assignment ID"
        required: true
        schema:
          type: "string"
      - name: "viewType"
        in: "query"
        description: "form - returns the form UI metadata, page - returns the full\
          \ page UI metadata"
        allowEmptyValue: true
        schema:
          type: "string"
          default: "page"
          enum:
          - "page"
          - "form"
      - name: "pageName"
        in: "query"
        description: "return view metadata for pagename view"
        allowEmptyValue: true
        schema:
          type: "string"
      responses:
        "200":
          description: "Response"
          headers:
            etag:
              description: "holds ETag unique value"
              schema:
                type: "string"
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SCHEMA_FILE_WEBWB_PZGETASSIGNMENT"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "423":
          description: "Locked"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "403":
          description: "No access"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
  /assignments/{assignmentID}/actions/{actionID}:
    get:
      tags:
      - "Assignment"
      summary: "Get action details of an assignment"
      description: "<p>Opens assignment action based on assignment and action ID.</p>"
      parameters:
      - name: "x-origin-channel"
        in: "header"
        description: "Origin of this service. E.g. - Web, Mobile etc."
        schema:
          type: "string"
      - name: "assignmentID"
        in: "path"
        description: "Assignment ID"
        required: true
        schema:
          type: "string"
      - name: "actionID"
        in: "path"
        description: "Name of the assignment action"
        required: true
        schema:
          type: "string"
      - name: "viewType"
        in: "query"
        description: "form - returns the form UI metadata, page - returns the full\
          \ page UI metadata"
        allowEmptyValue: true
        schema:
          type: "string"
          default: "form"
          enum:
          - "form"
          - "page"
      - name: "excludeAdditionalActions"
        in: "query"
        description: "true - excludes additional actions/assignments from response"
        allowEmptyValue: true
        schema:
          type: "boolean"
      responses:
        "200":
          description: "Response"
          headers:
            etag:
              description: "holds eTag unique value"
              schema:
                type: "string"
            cache-control:
              description: "Client cache control mechanism - disable it"
              schema:
                type: "string"
                enum:
                - "no-store"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SCHEMA_FILE_WEBWB_PZGETASSIGNMENT"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RULE-OBJ-CLASS.CODE-AUTOMATION-ERRORS.true.PEGA_API.PZCONVERTERRORSTOJSON"
        "400":
          description: "Bad request"
          content:
