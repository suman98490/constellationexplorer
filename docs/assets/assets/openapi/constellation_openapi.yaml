  schemas:
    RULE-OBJ-CLASS.DATA-PARTY.true.PEGA_API:
      title: "Party Information"
      type: "object"
      properties:
        pxCommitDateTime:
          title: "Commit DateTime"
          type: "string"
          format: "date-time"
          readOnly: true
        pxCreateDateTime:
          title: "Create Date/Time"
          type: "string"
          description: "Date and time when this instance was created."
          format: "date-time"
          readOnly: true
        pxCreateOperator:
          title: "Create Operator"
          type: "string"
          description: "It denotes the id of the person that created a specific entity,\
            \ record, or object within the application. An operator ID is a unique\
            \ alphanumeric identifier assigned to an individual, typically within\
            \ an organization or a system. It often follows a specific naming convention\
            \ that includes elements such as the individual's name, initials and domain\
            \ name, indicating the organization.(e.g.,'johndoe@pegasystems.com')."
          readOnly: true
        pxCreateOpName:
          title: "Create operator name"
          type: "string"
          description: "It denotes the name of the person that created a specific\
            \ entity, record, or object within the application. An 'operator name'\
            \ is an identifier or label assigned to a specific individual within a\
            \ particular system, organization, or context. It follows a naming convention\
            \ that typically includes a structured format, such as combining a first\
            \ name and a last name (e.g., 'John Doe')."
          readOnly: true
        pxCreateSystemID:
          title: "Create System ID"
          type: "string"
          description: "Date and time when this instance was created."
          readOnly: true
        pyFirstName:
          title: "First Name"
          type: "string"
          description: "First Name"
        pyFullName:
          title: "Full Name"
          type: "string"
          description: "x"
        pyImageInsKey:
